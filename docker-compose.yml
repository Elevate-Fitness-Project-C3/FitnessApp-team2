services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    hostname: gym-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${SQL_SERVER_PASSWORD:?Set SQL_SERVER_PASSWORD in .env}
    ports:
      - "127.0.0.1:14330:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "SQLCMDPASSWORD=\"$${MSSQL_SA_PASSWORD}\" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  rabbitmq:
    image: rabbitmq:4-management
    hostname: gym-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: gym
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-gym-dev-password}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

  mailpit:
    image: axllent/mailpit:v1.27.0
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"

  identityservice:
    build:
      context: .
      dockerfile: IdentityService/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__IdentityDatabase: 'Server=sqlserver,1433;Database=gym-idntity;User Id=sa;Password="${SQL_SERVER_PASSWORD}";Encrypt=True;TrustServerCertificate=True'
      EmailSettings__LocalInbox: "true"
      EmailSettings__Host: mailpit
      EmailSettings__Port: 1025
      EmailSettings__SenderEmail: identity@gym.test
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: gym
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-gym-dev-password}
      Jwt__SecretKey: ${JWT_SECRET_KEY:-}
    ports:
      - "127.0.0.1:5003:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
      mailpit:
        condition: service_started

  fitnessprofileservice:
    environment:
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: gym
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-gym-dev-password}
    image: ${DOCKER_REGISTRY-}fitnessprofileservice
    build:
      context: .
      dockerfile: FitnessProfileService/Dockerfile

volumes:
  sqlserver-data:
  rabbitmq-data:
